name: wm_app
description: "WM Business Management & Inventory Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Database
  drift: ^2.18.0
  sqlite3: ^2.4.5
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Navigation
  go_router: ^14.2.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  share_plus: ^9.0.0
  file_picker: 8.0.3
  url_launcher: ^6.3.0
  flutter_secure_storage: ^9.2.2

  # Scanner
  mobile_scanner: ^5.1.1

  # PDF & Receipts
  pdf: ^3.11.0
  printing: ^5.12.0

  # UI
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  assets:
    - assets/
