<!doctype html>
<html>
<head><meta charset="utf-8"><title>IndexedDB worker diagnostic</title></head>
<body>
  <pre id="status">Starting dedicated worker…</pre>
  <script>
    const status = document.getElementById('status');
    const trace = new BroadcastChannel('drift-worker-diagnostics');
    trace.onmessage = event => status.textContent += `\nTRACE: ${event.data}`;
    const worker = new Worker('/worker_bootstrap.js');
    worker.onmessage = event => {
      status.textContent += `\nmessage: ${JSON.stringify(event.data)}`;
    };
    worker.onerror = event => {
      status.textContent += `\nerror: ${event.message} at ${event.filename}:${event.lineno}`;
    };
    worker.postMessage({type: 'RequestCompatibilityCheck', payload: 'wm_worker_indexeddb_diag'});
    setTimeout(() => status.textContent += '\ntimeout', 5000);
  </script>
</body>
</html>
